services:
  # PostgreSQL Database
  - type: pserv
    name: alshatibi-postgres
    ipAllowList: []
    plan: free
    postgresSQLVersion: '16'

  # Backend Service
  - type: web
    name: alshatibi-backend
    env: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        fromService:
          type: pserv
          name: alshatibi-postgres
          property: host
      - key: DB_PORT
        fromService:
          type: pserv
          name: alshatibi-postgres
          property: port
      - key: DB_USER
        fromService:
          type: pserv
          name: alshatibi-postgres
          property: user
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: alshatibi-postgres
          property: password
      - key: DB_NAME
        fromService:
          type: pserv
          name: alshatibi-postgres
          property: database
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /opt/render/project/backend/uploads
      sizeGB: 1
    dependsOn:
      - alshatibi-postgres

  # Frontend Service
  - type: web
    name: alshatibi-frontend
    env: static
    region: frankfurt
    plan: free
    rootDir: customer-app
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://alshatibi-backend.onrender.com/api
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
